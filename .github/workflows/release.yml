name: Release

# Push a tag like v2.0.0 to build every installer and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 2.0.0'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ($env:VERSION -replace '^v','')
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/*-setup.exe
            artifacts/*.zip

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build
        run: bash packaging/macos/build.sh "${VERSION#v}" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/*.dmg

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build
        run: bash packaging/linux/build.sh "${VERSION#v}" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Claude Switch only installs an update whose checksums carry this
      # signature (ECDSA P-256 / SHA-256). The private key is the repository
      # secret RELEASE_SIGNING_KEY (PEM); its public half is in SelfUpdate.cs.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::RELEASE_SIGNING_KEY secret is missing; refusing to publish an unsigned release"; exit 1; fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
          openssl pkey -in key.pem -pubout -out pub.pem
          openssl dgst -sha256 -verify pub.pem -signature dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
          rm -f key.pem pub.pem
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Claude Switch ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
